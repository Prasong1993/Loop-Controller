openapi: 3.1.0
info:
  title: NEXUS Controller API
  version: 0.4.0
  description: >
    Deterministic project workflow controller. Configure NEXUS_API_KEY on the
    server and send it as a Bearer token. This REST contract alone does not
    create a ChatGPT connector; the target account/interface must support and
    configure a compatible integration.
servers:
  - url: https://YOUR-SECURE-NEXUS-HOST
    description: Replace with the deployed HTTPS endpoint after security review.
security:
  - BearerAuth: []
paths:
  /health:
    get:
      operationId: nexusHealth
      security: []
      summary: Check service liveness
      responses:
        "200":
          description: Service is responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  version: { type: string }
  /projects:
    post:
      operationId: nexusCreateProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201": { description: Project created }
        "401": { description: Missing bearer token }
        "403": { description: Invalid bearer token or policy denied }
        "503": { description: Remote API disabled because no token is configured }
  /projects/{project_id}/status:
    get:
      operationId: nexusGetProjectStatus
      summary: Read project state and task counts
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Project status }
        "404": { description: Project not found }
  /tasks:
    post:
      operationId: nexusCreateTask
      summary: Create a task in a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, title]
              properties:
                project_id: { type: string }
                title: { type: string, minLength: 1, maxLength: 500 }
                expected_outcome: { type: string }
                verification_method: { type: string }
      responses:
        "201": { description: Task created }
        "404": { description: Project not found }
  /tasks/{task_id}:
    get:
      operationId: nexusGetTask
      summary: Read task status
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Task status }
        "404": { description: Task not found }
  /tasks/{task_id}/transition:
    post:
      operationId: nexusTransitionTask
      summary: Request a policy-gated state transition
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_state]
              properties:
                to_state: { type: string, enum: [INTAKE, RESEARCH, PLAN, POLICY, EXECUTE, VERIFY, AUDIT, COMPLETE, RECOVER, BLOCKED] }
                actor: { type: string, default: api }
                reason: { type: string }
                result: { type: [string, "null"] }
                error_code: { type: [string, "null"] }
      responses:
        "200": { description: Transition accepted }
        "403": { description: Policy denied }
        "404": { description: Task not found }
        "409": { description: Invalid transition }
  /tasks/{task_id}/checkpoint:
    post:
      operationId: nexusCreateCheckpoint
      summary: Create a task checkpoint
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Checkpoint created }
        "404": { description: Task not found }
  /tasks/{task_id}/restore:
    post:
      operationId: nexusRestoreCheckpoint
      summary: Restore safe checkpoint metadata after BLOCKED or RECOVER
      description: Execution-state checkpoints are not automatically replayed.
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkpoint_id]
              properties:
                checkpoint_id: { type: string }
                actor: { type: string, default: api }
                reason: { type: string }
      responses:
        "200": { description: Checkpoint restored }
        "403": { description: Restore policy denied }
        "404": { description: Task or checkpoint not found }
  /evidence:
    post:
      operationId: nexusAddEvidenceRecord
      summary: Record evidence status
      description: >
        A URL alone is not proof that a claim was independently verified.
        VERIFIED is prohibited here; use /evidence/verify for trusted fetch-and-quote verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, claim, status]
              properties:
                project_id: { type: string }
                claim: { type: string, minLength: 1, maxLength: 2000 }
                status: { type: string, enum: [RECOVERED, UNKNOWN, BLOCKED] }
                source_url: { type: [string, "null"], format: uri }
                notes: { type: string }
                task_id: { type: [string, "null"], description: Optional task scope; absent means project-wide evidence }
      responses:
        "200": { description: Evidence recorded }
        "403": { description: Policy denied }
        "404": { description: Project not found }
  /evidence/verify:
    post:
      operationId: nexusVerifySourceEvidence
      summary: Fetch a public HTTPS source and verify an exact quote before recording VERIFIED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, claim, source_url, quoted_text]
              properties:
                project_id: { type: string }
                claim: { type: string, minLength: 1, maxLength: 2000 }
                source_url: { type: string, format: uri, description: HTTPS public URL only; redirects are not followed }
                quoted_text: { type: string, minLength: 1, maxLength: 5000 }
                notes: { type: string }
                task_id: { type: [string, "null"], description: Optional task scope; absent means project-wide evidence }
      responses:
        "200": { description: Exact quote matched source content; VERIFIED evidence recorded }
        "403": { description: Authorization or policy denied }
        "404": { description: Project not found }
        "422": { description: Unsafe URL, fetch failure, unsupported content or quote mismatch }
  /projects/{project_id}/audit:
    get:
      operationId: nexusReadProjectAudit
      summary: Read project audit events
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: query
          name: task_id
          schema: { type: string }
      responses:
        "200": { description: Audit events }
        "404": { description: Project not found }
  /policy/route:
    post:
      operationId: nexusSelectToolRoute
      summary: Select an eligible tool candidate without executing it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidates]
              properties:
                candidates: { type: array, items: { type: object } }
                allow_paid: { type: boolean, default: false }
                budget_approved: { type: boolean, default: false }
      responses:
        "200": { description: Route decision }

  /records/search:
    get:
      operationId: nexusSearchOperationalRecords
      summary: Search redacted usage, error, evidence, decision, checkpoint and verification records
      parameters:
        - in: query
          name: project_id
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: record_type
          schema: { type: string, enum: [usage, error, evidence, decision, checkpoint, verification] }
        - in: query
          name: task_id
          schema: { type: string }
        - in: query
          name: trace_id
          schema: { type: string }
        - in: query
          name: operation_id
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: error_code
          schema: { type: string }
        - in: query
          name: component
          schema: { type: string }
        - in: query
          name: query
          schema: { type: string }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200": { description: Project-scoped paginated operational records }
        "422": { description: Invalid filters or pagination }
  /ai/plan:
    post:
      operationId: nexusProposeStructuredPlan
      summary: Generate a structured plan proposal through OpenAI Responses API
      description: >
        Requires request budget_approved=true AND server environment
        NEXUS_OPENAI_BUDGET_APPROVED=true. A proposal never authorizes execution.
        Only verified supported optional capabilities may be enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, task]
              properties:
                project_id: { type: string, minLength: 1, maxLength: 200 }
                task: { type: string, minLength: 1, maxLength: 20000 }
                constraints: { type: array, maxItems: 100, items: { type: string } }
                capabilities: { type: array, maxItems: 2, items: { type: string, enum: [web_search] } }
                budget_approved: { type: boolean, default: false }
      responses:
        "200": { description: Structured proposal only; deterministic policy has not approved execution }
        "403": { description: Budget approval gate blocked the provider call }
        "422": { description: Invalid request or unsupported capability }
        "502": { description: OpenAI provider request failed }
        "503": { description: OpenAI API key or SDK is unavailable }

  /ai/code-proposal:
    post:
      operationId: nexusProposeCodeChanges
      summary: Generate reviewable code-file proposals through OpenAI Responses API
      description: >
        Returns proposed file contents only. It never writes files or executes code.
        Requires budget_approved=true in the request and
        NEXUS_OPENAI_BUDGET_APPROVED=true on the server. Each proposed path must
        exactly match allowed_paths. Code model defaults to gpt-6-astra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, task, allowed_paths]
              properties:
                project_id: { type: string, minLength: 1, maxLength: 200 }
                task_id: { type: [string, "null"] }
                task: { type: string, minLength: 1, maxLength: 20000 }
                allowed_paths: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
                constraints: { type: array, maxItems: 100, items: { type: string } }
                budget_approved: { type: boolean, default: false }
      responses:
        "200": { description: Code proposal only; no write or execution was performed }
        "403": { description: Budget, path allowlist or project/task scope policy blocked the request }
        "404": { description: Project or task not found }
        "422": { description: Invalid request or unsafe allowed_paths }
        "502": { description: OpenAI code proposal request failed }
        "503": { description: OpenAI API key or SDK is unavailable }
  /ai/run:
    post:
      operationId: nexusRunOpenAIReadTools
      summary: Run OpenAI Responses API with NEXUS-gated read-only project tools
      description: >
        Only project status, task detail and audit read tools are registered.
        Each tool request is checked by deterministic NEXUS policy and limited
        to the project_id in this request. Requires request budget_approved=true
        AND server environment NEXUS_OPENAI_BUDGET_APPROVED=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, prompt]
              properties:
                project_id: { type: string, minLength: 1, maxLength: 200 }
                prompt: { type: string, minLength: 1, maxLength: 20000 }
                budget_approved: { type: boolean, default: false }
      responses:
        "200": { description: Model response and policy decisions for read-only tool calls }
        "403": { description: Budget gate or deterministic policy denial }
        "422": { description: Invalid request }
        "502": { description: OpenAI provider or tool orchestration failed }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque API token
